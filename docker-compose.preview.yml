services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grain-preview-backend
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8101:8000"
    volumes:
      - ./storage:/storage
      - ./models:/models
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_RELOAD: "true"
      CORS_ORIGINS: https://dev.grain.capootech.com,http://127.0.0.1:3101,http://localhost:3101
      TEMP_STORAGE_PATH: /storage/temp
      MODEL_CACHE_DIR: /models
    env_file:
      - ./backend/.env
    networks:
      - grain-preview-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grain-preview-frontend
    restart: unless-stopped
    depends_on:
      - backend
    command: npm run dev -- -p 3000
    ports:
      - "127.0.0.1:3101:3000"
    environment:
      NEXT_PUBLIC_API_URL: /api
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    networks:
      - grain-preview-network

networks:
  grain-preview-network:
    driver: bridge
