sync:
  defaults:
    mode: one-way-safe
    ignore:
      paths:
        - "/.git"
        - "/.deploy-*"
        - "/frontend/node_modules"
        - "/frontend/.next"
        - "/backend/__pycache__"
        - "/storage/temp"
        - "/models"
        - "/backend/.env"
        - "/mutagen.yml.lock"

  code:
    alpha: "."
    beta: "capoo-hk:/opt/gain-preview"
    mode: one-way-safe
