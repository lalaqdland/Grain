server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev.grain.capoo.tech;

    ssl_certificate /etc/letsencrypt/live/dev.grain.capoo.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.grain.capoo.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location = /api/health {
        proxy_pass http://127.0.0.1:8101/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=grain_api_rate burst=20 nodelay;
        limit_conn grain_conn 20;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        limit_req zone=grain_api_rate burst=20 nodelay;
        limit_conn grain_conn 20;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        limit_conn grain_conn 40;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.grain.capoo.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.grain.capootech.com;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev.grain.capootech.com;

    ssl_certificate /etc/letsencrypt/live/dev.grain.capootech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.grain.capootech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 444;
}
