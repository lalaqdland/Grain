services:
  backend:
    image: ${IMAGE_REPO_BASE}/grain-backend:${IMAGE_TAG}
    container_name: grain-preview-backend
    restart: unless-stopped
    stop_grace_period: 20s
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "0.0.0.0:8101:8000"
    volumes:
      - ./storage:/storage
      - ./models:/models
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_RELOAD: "true"
      CORS_ORIGINS: http://${SHANGHAI_HOST}:3101,http://127.0.0.1:3101,http://localhost:3101
      TEMP_STORAGE_PATH: /storage/temp
      MODEL_CACHE_DIR: /models
      USE_MARIAN_MT: "true"
      EXPORT_STATS_DB_WARN_BYTES: "10485760"
      EXPORT_STATS_DB_CRITICAL_BYTES: "52428800"
    env_file:
      - ./backend/.env
    networks:
      - grain-preview-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: ${IMAGE_REPO_BASE}/grain-frontend:${IMAGE_TAG}
    container_name: grain-preview-frontend
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      - backend
    command: npm run dev -- -p 3000
    ports:
      - "0.0.0.0:3101:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://${SHANGHAI_HOST}:8101
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    networks:
      - grain-preview-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 180s

networks:
  grain-preview-network:
    driver: bridge
