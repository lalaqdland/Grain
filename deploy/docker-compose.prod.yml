services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grain-backend
    restart: unless-stopped
    stop_grace_period: 20s
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - '127.0.0.1:8001:8000'
    volumes:
      - ./storage:/storage
      - ./models:/models
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_RELOAD: 'false'
      CORS_ORIGINS: https://grain.capootech.com,https://capootech.com,https://www.capootech.com
      TEMP_STORAGE_PATH: /storage/temp
      MODEL_CACHE_DIR: /models
    env_file:
      - ./backend/.env
    networks:
      - grain-network
    cpus: '0.70'
    mem_limit: 512m
    mem_reservation: 256m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grain-frontend
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      - backend
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      NEXT_PUBLIC_API_URL: /api
      NODE_ENV: production
    command: sh -c "npm run build && npm run start -- -p 3000"
    networks:
      - grain-network
    cpus: '0.90'
    mem_limit: 1024m
    mem_reservation: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

networks:
  grain-network:
    driver: bridge
