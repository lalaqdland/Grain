name: Deploy Grain

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: "Deploy target for manual runs"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: "Existing image tag to deploy (optional)"
        required: false
        type: string

jobs:
  build_and_push_images:
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.meta.outputs.target_env }}
      target_host: ${{ steps.meta.outputs.target_host }}
      compose_src: ${{ steps.meta.outputs.compose_src }}
      healthcheck_url: ${{ steps.meta.outputs.healthcheck_url }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      should_build: ${{ steps.meta.outputs.should_build }}
      rolling_tag: ${{ steps.meta.outputs.rolling_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve deployment metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
              target_env="dev"
            elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
              target_env="prod"
            else
              echo "Unsupported push branch: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          else
            target_env="${{ github.event.inputs.target_env }}"
          fi

          if [[ "${target_env}" == "dev" ]]; then
            target_host="${{ secrets.HOST_SHANGHAI }}"
            compose_src="deploy/docker-compose.ci.dev.yml"
            healthcheck_url="http://${{ secrets.HOST_SHANGHAI }}:8101/health"
            rolling_tag="dev-latest"
          elif [[ "${target_env}" == "prod" ]]; then
            target_host="${{ secrets.HOST_HK_GRAIN }}"
            compose_src="deploy/docker-compose.ci.prod.yml"
            healthcheck_url="https://grain.capootech.com/api/health"
            rolling_tag="main-latest"
          else
            echo "Unsupported target environment: ${target_env}" >&2
            exit 1
          fi

          requested_tag="${{ github.event.inputs.image_tag }}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${requested_tag}" ]]; then
            image_tag="${requested_tag}"
            should_build="false"
          else
            image_tag="${GITHUB_SHA}"
            should_build="true"
          fi

          echo "target_env=${target_env}" >> "${GITHUB_OUTPUT}"
          echo "target_host=${target_host}" >> "${GITHUB_OUTPUT}"
          echo "compose_src=${compose_src}" >> "${GITHUB_OUTPUT}"
          echo "healthcheck_url=${healthcheck_url}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "should_build=${should_build}" >> "${GITHUB_OUTPUT}"
          echo "rolling_tag=${rolling_tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        if: steps.meta.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        if: steps.meta.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push backend image
        if: steps.meta.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ secrets.ALIYUN_REGISTRY }}/capoo/grain-backend:${{ steps.meta.outputs.image_tag }}
            ${{ secrets.ALIYUN_REGISTRY }}/capoo/grain-backend:${{ steps.meta.outputs.rolling_tag }}

      - name: Build and push frontend image
        if: steps.meta.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ secrets.ALIYUN_REGISTRY }}/capoo/grain-frontend:${{ steps.meta.outputs.image_tag }}
            ${{ secrets.ALIYUN_REGISTRY }}/capoo/grain-frontend:${{ steps.meta.outputs.rolling_tag }}

  deploy_target:
    runs-on: ubuntu-latest
    needs: build_and_push_images
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ needs.build_and_push_images.outputs.target_host }}" >> ~/.ssh/known_hosts

      - name: Upload compose file
        shell: bash
        run: |
          set -euo pipefail
          target_host="${{ needs.build_and_push_images.outputs.target_host }}"
          compose_src="${{ needs.build_and_push_images.outputs.compose_src }}"
          ssh -i ~/.ssh/id_rsa "root@${target_host}" "mkdir -p /opt/gain-project"
          scp -i ~/.ssh/id_rsa "${compose_src}" "root@${target_host}:/opt/gain-project/docker-compose.ci.yml"

      - name: Pull and restart services on target host
        shell: bash
        run: |
          set -euo pipefail
          target_host="${{ needs.build_and_push_images.outputs.target_host }}"
          image_tag="${{ needs.build_and_push_images.outputs.image_tag }}"

          printf '%s' "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" | ssh -i ~/.ssh/id_rsa "root@${target_host}" \
            "docker login '${{ secrets.ALIYUN_REGISTRY }}' -u '${{ secrets.ALIYUN_REGISTRY_USER }}' --password-stdin"

          ssh -i ~/.ssh/id_rsa "root@${target_host}" "\
            cd /opt/gain-project && \
            export ALIYUN_REGISTRY='${{ secrets.ALIYUN_REGISTRY }}' && \
            export IMAGE_TAG='${image_tag}' && \
            export SHANGHAI_HOST='${{ secrets.HOST_SHANGHAI }}' && \
            docker compose -f docker-compose.ci.yml pull && \
            docker compose -f docker-compose.ci.yml up -d --force-recreate"

      - name: Post-deploy health check
        shell: bash
        run: |
          set -euo pipefail
          health_url="${{ needs.build_and_push_images.outputs.healthcheck_url }}"
          for _ in {1..18}; do
            if curl -fsS --max-time 10 "${health_url}" > /tmp/health.out; then
              cat /tmp/health.out
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: ${health_url}" >&2
          exit 1
