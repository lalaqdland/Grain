name: Deploy Grain

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: "Deploy target for manual runs"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: "Existing image tag to deploy (optional)"
        required: false
        type: string

jobs:
  build_and_push_images:
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.meta.outputs.target_env }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      should_build: ${{ steps.meta.outputs.should_build }}
      rolling_tag: ${{ steps.meta.outputs.rolling_tag }}
      image_repo_base: ${{ steps.registry.outputs.image_repo_base }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve deployment metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            case "${GITHUB_REF_NAME}" in
              dev)
                target_env="dev"
                rolling_tag="dev-latest"
                ;;
              main)
                target_env="prod"
                rolling_tag="main-latest"
                ;;
              *)
                echo "Unsupported push branch: ${GITHUB_REF_NAME}" >&2
                exit 1
                ;;
            esac
          else
            target_env="${{ github.event.inputs.target_env }}"
            case "${target_env}" in
              dev)
                rolling_tag="dev-latest"
                ;;
              prod)
                rolling_tag="main-latest"
                ;;
              *)
                echo "Unsupported manual target environment: ${target_env}" >&2
                exit 1
                ;;
            esac
          fi

          requested_tag="${{ github.event.inputs.image_tag }}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${requested_tag}" ]]; then
            image_tag="${requested_tag}"
            should_build="false"
          else
            image_tag="${GITHUB_SHA}"
            should_build="true"
          fi

          echo "target_env=${target_env}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "should_build=${should_build}" >> "${GITHUB_OUTPUT}"
          echo "rolling_tag=${rolling_tag}" >> "${GITHUB_OUTPUT}"

      - name: Resolve registry metadata
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          registry_host="${{ secrets.ALIYUN_REGISTRY_HOST }}"
          namespace="${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}"

          registry_host="${registry_host%/}"
          namespace="${namespace#/}"
          namespace="${namespace%/}"

          if [[ -z "${registry_host}" ]]; then
            echo "Missing secret: ALIYUN_REGISTRY_HOST" >&2
            exit 1
          fi

          if [[ -z "${namespace}" ]]; then
            echo "Missing secret: ALIYUN_REGISTRY_NAMESPACE" >&2
            exit 1
          fi

          image_repo_base="${registry_host}/${namespace}"
          echo "image_repo_base=${image_repo_base}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        if: steps.meta.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: steps.meta.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY_HOST }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push backend image
        if: steps.meta.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          image_tag="${{ steps.meta.outputs.image_tag }}"
          rolling_tag="${{ steps.meta.outputs.rolling_tag }}"
          image_repo_base="${{ steps.registry.outputs.image_repo_base }}"

          docker buildx build \
            --file ./backend/Dockerfile \
            --tag "${image_repo_base}/grain-backend:${image_tag}" \
            --tag "${image_repo_base}/grain-backend:${rolling_tag}" \
            --provenance=false \
            --push \
            ./backend

      - name: Build and push frontend image
        if: steps.meta.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          image_tag="${{ steps.meta.outputs.image_tag }}"
          rolling_tag="${{ steps.meta.outputs.rolling_tag }}"
          image_repo_base="${{ steps.registry.outputs.image_repo_base }}"

          docker buildx build \
            --file ./frontend/Dockerfile \
            --tag "${image_repo_base}/grain-frontend:${image_tag}" \
            --tag "${image_repo_base}/grain-frontend:${rolling_tag}" \
            --provenance=false \
            --push \
            ./frontend

  deploy_target:
    runs-on: ubuntu-latest
    needs: build_and_push_images
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve deployment target
        shell: bash
        run: |
          set -euo pipefail
          target_env="${{ needs.build_and_push_images.outputs.target_env }}"

          case "${target_env}" in
            dev)
              target_host="${{ secrets.HOST_SHANGHAI }}"
              ssh_user="${{ secrets.SSH_USER_SHANGHAI }}"
              ssh_port="${{ secrets.SSH_PORT_SHANGHAI }}"
              healthcheck_url="http://${{ secrets.HOST_SHANGHAI }}:8101/health"
              compose_src="deploy/docker-compose.ci.dev.yml"
              ;;
            prod)
              target_host="${{ secrets.HOST_HK_GRAIN }}"
              ssh_user="${{ secrets.SSH_USER_HK_GRAIN }}"
              ssh_port="${{ secrets.SSH_PORT_HK_GRAIN }}"
              healthcheck_url="https://grain.capootech.com/api/health"
              compose_src="deploy/docker-compose.ci.prod.yml"
              ;;
            *)
              echo "Unsupported target environment: ${target_env}" >&2
              exit 1
              ;;
          esac

          if [[ -z "${target_host}" || -z "${ssh_user}" || -z "${ssh_port}" ]]; then
            echo "Missing SSH target settings for environment: ${target_env}" >&2
            exit 1
          fi

          echo "::add-mask::${target_host}"
          echo "TARGET_ENV=${target_env}" >> "${GITHUB_ENV}"
          echo "TARGET_HOST=${target_host}" >> "${GITHUB_ENV}"
          echo "SSH_USER=${ssh_user}" >> "${GITHUB_ENV}"
          echo "SSH_PORT=${ssh_port}" >> "${GITHUB_ENV}"
          echo "HEALTHCHECK_URL=${healthcheck_url}" >> "${GITHUB_ENV}"
          echo "COMPOSE_SRC=${compose_src}" >> "${GITHUB_ENV}"
          echo "IMAGE_REPO_BASE=${{ needs.build_and_push_images.outputs.image_repo_base }}" >> "${GITHUB_ENV}"

      - name: Print deploy context
        shell: bash
        run: |
          set -euxo pipefail
          echo "TARGET_ENV=${TARGET_ENV}"
          echo "SSH_USER=${SSH_USER}"
          echo "SSH_PORT=${SSH_PORT}"
          echo "COMPOSE_SRC=${COMPOSE_SRC}"
          echo "IMAGE_REPO_BASE=${IMAGE_REPO_BASE}"

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [[ "${TARGET_ENV}" == "dev" ]]; then
            private_key="${{ secrets.SSH_PRIVATE_KEY_SHANGHAI }}"
          else
            private_key="${{ secrets.SSH_PRIVATE_KEY_HK_GRAIN }}"
          fi

          if [[ -z "${private_key}" ]]; then
            echo "Missing SSH private key for target environment: ${TARGET_ENV}" >&2
            exit 1
          fi

          printf '%s' "${private_key}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa >/dev/null
          ssh-keyscan -p "${SSH_PORT}" -H "${TARGET_HOST}" >> ~/.ssh/known_hosts
          ssh -p "${SSH_PORT}" -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_rsa "${SSH_USER}@${TARGET_HOST}" "echo ssh-ok"

      - name: Upload compose file
        shell: bash
        run: |
          set -euxo pipefail
          ssh -p "${SSH_PORT}" -i ~/.ssh/id_rsa "${SSH_USER}@${TARGET_HOST}" "mkdir -p /opt/gain-project"
          scp -P "${SSH_PORT}" -i ~/.ssh/id_rsa "${COMPOSE_SRC}" "${SSH_USER}@${TARGET_HOST}:/opt/gain-project/docker-compose.ci.yml"

      - name: Pull and restart services on target host
        shell: bash
        run: |
          set -euxo pipefail
          image_tag="${{ needs.build_and_push_images.outputs.image_tag }}"
          registry_host="${{ secrets.ALIYUN_REGISTRY_HOST }}"

          printf '%s' "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" | ssh -p "${SSH_PORT}" -i ~/.ssh/id_rsa "${SSH_USER}@${TARGET_HOST}" \
            "docker login '${registry_host}' -u '${{ secrets.ALIYUN_REGISTRY_USER }}' --password-stdin"

          ssh -p "${SSH_PORT}" -i ~/.ssh/id_rsa "${SSH_USER}@${TARGET_HOST}" "\
            set -euxo pipefail; \
            cd /opt/gain-project && \
            export IMAGE_REPO_BASE='${IMAGE_REPO_BASE}' && \
            export IMAGE_TAG='${image_tag}' && \
            export SHANGHAI_HOST='${{ secrets.HOST_SHANGHAI }}' && \
            docker compose -f docker-compose.ci.yml pull && \
            docker compose -f docker-compose.ci.yml up -d --force-recreate"

      - name: Post-deploy health check
        shell: bash
        run: |
          set -euxo pipefail
          for _ in {1..18}; do
            if curl -fsS --max-time 10 "${HEALTHCHECK_URL}" > /tmp/health.out; then
              cat /tmp/health.out
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: ${HEALTHCHECK_URL}" >&2
          exit 1
